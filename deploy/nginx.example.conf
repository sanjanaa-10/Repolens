# RepoLens production reverse-proxy reference (nginx).
#
# Serves the static frontend build and proxies /api to the uvicorn backend.
# TLS termination is handled by your certificate setup (certbot / Let's
# Encrypt, or a managed certificate). Do not expose the raw backend.
#
# Prereqs:
#   - Set REPOLENS_TRUSTED_HOSTS on the backend to this server_name
#     (e.g. repolens.example.com), or TrustedHostMiddleware rejects requests.
#   - Build the frontend first:  cd frontend && npm ci && npm run build
#   - Run the backend on 127.0.0.1:8000 (see DEPLOYMENT.md).

# HTTP -> HTTPS redirect (optional; adapt to your TLS setup).
server {
    listen 80;
    server_name repolens.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name repolens.example.com;

    # Point these to your certificate/key (e.g. Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/repolens.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repolens.example.com/privkey.pem;

    root /srv/repolens/frontend/dist;
    index index.html;

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy; the backend owns /api and all sub-resources.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (the backend also sets its own).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}